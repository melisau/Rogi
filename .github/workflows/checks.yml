name: Rogi checks
on: [push, pull_request]
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rogi-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rogi-landing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm --prefix ../seo-kontrol run build
